<!DOCTYPE html>
<html>
  <head>   
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"> 
    <title>Ejercicio 6</title>
    <script type="text/javascript">
        window.onload = function(){
            const Foto=document.getElementById('foto');//Acedemos al elemento ia
            document.getElementById("Boton").onclick=function(){
                let anch=document.getElementById("C1").value;
                let alt=document.getElementById("C2").value;
                Foto.style.width=parseInt(anch) + "px";
                Foto.style.height=parseInt(alt) + "px";
            }

        }
    </script>  
  </head>
  <body>
    <span>"Ancho"</span>
    <input id="C1" Type="text"> 
    <span>"Alto"</span>
    <input id="C2" Type="text"> 
    <button id="Boton">Enviar</button>
    <img src="https://img.magnific.com/foto-gratis/colorida-majestuosa-cascada-bosque-parque-nacional-otono_554837-661.jpg?semt=ais_hybrid&w=740&q=80" id="foto">
  </body>
</html>
